<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mercado VIVA - Devoluciones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div class="marca">
      <span class="logo-mark">V</span>
      <div>
        <h1>Mercado VIVA</h1>
        <p>Panel de Devoluciones · Empleado de tienda</p>
      </div>
    </div>
  </header>

  <div id="barra-empleado" class="barra-empleado" hidden>
    <div class="barra-empleado-contenido">
      <span></span>
      <div id="perfil-menu" class="perfil-menu">
        <button id="btn-perfil" type="button" class="perfil-trigger">
          <span class="avatar-mini">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-1.5A5.5 5.5 0 0 0 14.5 14h-5A5.5 5.5 0 0 0 4 19.5V21"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <span id="empleado-nombre"></span>
          <svg class="perfil-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div id="perfil-dropdown" class="perfil-dropdown" hidden>
          <button id="btn-cerrar-sesion" type="button" class="perfil-opcion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
              <path d="M16 17l5-5-5-5"/>
              <path d="M21 12H9"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>

  <main>
    <section id="seccion-login" class="pantalla">
      <h2>Iniciar sesión</h2>
      <form id="form-login">
        <label for="login-username">Usuario</label>
        <input type="text" id="login-username" required>

        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required>

        <button type="submit">Ingresar</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="seccion-buscar" class="pantalla" hidden>
      <h2>Buscar orden</h2>
      <form id="form-buscar">
        <label for="buscar-numero-orden">Número de orden</label>
        <input type="text" id="buscar-numero-orden" placeholder="Ej: ORD-1001">

        <label for="buscar-documento">Documento del cliente</label>
        <input type="text" id="buscar-documento" placeholder="Ej: 123456789">

        <button type="submit">Buscar</button>
      </form>
      <p id="buscar-error" class="error" hidden></p>
    </section>

    <section id="seccion-registro" class="pantalla" hidden>
      <button id="btn-volver-buscar" type="button" class="volver-boton">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
        Nueva búsqueda
      </button>
      <h2>Detalle de la orden</h2>
      <div id="detalle-orden"></div>

      <form id="form-devolucion" hidden>
        <h3>Registrar devolución</h3>
        <input type="hidden" id="devolucion-item-id">

        <label for="devolucion-motivo">Motivo</label>
        <textarea id="devolucion-motivo" required></textarea>

        <label for="devolucion-condicion">Condición del producto</label>
        <select id="devolucion-condicion" required>
          <option value="">Selecciona una opción</option>
          <option value="nuevo">Nuevo</option>
          <option value="abierto">Abierto</option>
          <option value="dañado">Dañado</option>
        </select>

        <div id="devolucion-mal-uso-wrapper" hidden>
          <label>
            <input type="checkbox" id="devolucion-mal-uso">
            El daño fue causado por mal uso del cliente
          </label>
        </div>

        <button type="submit">Confirmar devolución</button>
      </form>
      <p id="registro-error" class="error" hidden></p>
    </section>

    <section id="seccion-confirmacion" class="pantalla pantalla-centrada" hidden>
      <div id="icono-confirmacion" class="check-exito"></div>
      <h2>Devolución registrada</h2>
      <div id="confirmacion-detalle" class="tarjeta"></div>
      <button id="btn-descargar-comprobante" type="button">Descargar comprobante</button>
      <button id="btn-nueva-devolucion" type="button" class="secundario">Registrar otra devolución</button>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
